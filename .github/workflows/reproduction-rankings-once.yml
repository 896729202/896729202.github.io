name: Verify grouped reproduction metric tables
on:
  push:
    branches: [site/reproduction-rankings-20261008-v1]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Record existing bytes without changing any experiment data
        run: |
          python3 - <<'PY'
          import json,hashlib,subprocess,os
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          before={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in files if n}
          (Path(os.environ['RUNNER_TEMP'])/'ranking-before.json').write_text(json.dumps(before))
          PY
      - name: Build and validate the two method families
        run: |
          python3 -m venv "$RUNNER_TEMP/ranking-env"
          "$RUNNER_TEMP/ranking-env/bin/python" -m pip install -q -r requirements.txt
          "$RUNNER_TEMP/ranking-env/bin/python" scripts/build.py
          "$RUNNER_TEMP/ranking-env/bin/python" scripts/check_reproduction_rankings.py
          node --check assets/reproduction-rankings.js
      - name: Check preservation and deterministic repeat build
        run: |
          "$RUNNER_TEMP/ranking-env/bin/python" - <<'PY'
          import json,hashlib,subprocess,os,sys
          from pathlib import Path
          before=json.loads((Path(os.environ['RUNNER_TEMP'])/'ranking-before.json').read_text())
          allowed={'thesis/experiments/reproductions/index.html'}
          for n,want in before.items():
            if n not in allowed:
              assert hashlib.sha256(Path(n).read_bytes()).hexdigest()==want, 'Unexpected change: '+n
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert new == {'thesis/experiments/reproductions/data/four-metric-view-20261008.csv','thesis/experiments/reproductions/data/four-metric-view-20261008.json'},new
          names=set(before)|new
          snapshot={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}
          subprocess.run([sys.executable,'scripts/build.py'],check=True)
          assert snapshot=={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}
          print('PASS: all experiment sources, legacy downloads, dataset/LoRA/RL pages unchanged; repeat build identical.')
          PY
      - name: Commit generated page on isolated branch
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thesis/experiments/reproductions/index.html thesis/experiments/reproductions/data/four-metric-view-20261008.csv thesis/experiments/reproductions/data/four-metric-view-20261008.json
          git rm .github/workflows/reproduction-rankings-once.yml
          git commit -m 'style: build dataset-first reproduction tables with per-metric top-two colors'
          git push origin "HEAD:$GITHUB_REF_NAME"
