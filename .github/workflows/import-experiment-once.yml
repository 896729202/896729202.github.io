name: Import dated experiment archive
on:
  push:
    branches: [main]
    paths:
      - '.archive-import/**'
      - '.github/workflows/import-experiment-once.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-experiment-once
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reassemble and verify original workbook
        run: |
          python3 - <<'PY'
          import hashlib
          import zipfile
          from io import BytesIO
          from pathlib import Path
          parts = [Path(f'.archive-import/part-{i:02d}.bin') for i in range(21)]
          data = b''.join(p.read_bytes() for p in parts)
          expected = 'df2d25c212faa117986bbdc6e314d72b27928b2c4d22c9f56663412563b9efaa'
          assert len(data) == 31286, 'Workbook size mismatch'
          assert hashlib.sha256(data).hexdigest() == expected, 'Workbook digest mismatch'
          with zipfile.ZipFile(BytesIO(data)) as z:
              assert z.testzip() is None, 'Workbook ZIP integrity check failed'
          target = Path('thesis/experiments/2026-09-29-endogs/endogs_experiment_log_2026-09-29.xlsx')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print('Original workbook verified:', len(data), 'bytes; SHA-256:', expected)
          PY
      - name: Build static pages
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/build.py
      - name: Check generated pages and unchanged LoRA article
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'index.html': '77b9d6c14e4d413104506c08613f8c31481de095',
              'thesis/index.html': '9af58d8a8b12b3530dfa2aa3e344d1ddc0aad963',
              'thesis/experiments/index.html': '05671744f76d0a3a3c907194b5cb0dca21bb4542',
              'thesis/experiments/2026-09-29-endogs/index.html': '56e7f422c4e642182e6530278cf947146931d620',
              'notes/lora/index.html': 'f55b0f3ad5f6cb9ea7a2eed7f1b6c039d6ec701d',
          }
          for name, sha in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert actual == sha, f'Generated file mismatch: {name}: {actual}'
              print('Verified:', name, actual)
          PY
      - name: Commit only website pages and original workbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html notes/index.html thesis/index.html thesis/experiments/index.html thesis/experiments/2026-09-29-endogs/index.html thesis/experiments/2026-09-29-endogs/endogs_experiment_log_2026-09-29.xlsx
          if git diff --cached --quiet; then
            echo 'Archive already up to date.'
          else
            git commit -m 'feat: publish 2026-09-29 experiment pages and verified original workbook'
            git push origin HEAD:main
          fi
