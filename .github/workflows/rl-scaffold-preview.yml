name: Build RL section on isolated branch
on:
  push:
    branches: ['site/rl-scaffold-20261008']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Record existing files and patch scoped search labels
        run: |
          python3 - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          p=Path('assets/site.js')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='3a48c63e0cdb6c6eb3b68684cb940c7722e3b47d'
          old='if (status) status.textContent = term ? `找到 ${found} 篇相关笔记` : `已收录 ${cards.length} 篇笔记`;'
          new="""if (status) {
                const grouped = cards.some(card => card.dataset.noteKind === 'topic');
                status.textContent = term
                  ? (grouped ? `找到 ${found} 个相关条目` : `找到 ${found} 篇相关笔记`)
                  : (grouped ? `共 ${cards.length} 个条目（笔记与专题）` : `已收录 ${cards.length} 篇笔记`);
              }"""
          source=p.read_text(); assert source.count(old)==1
          p.write_text(source.replace(old,new),encoding='utf-8')
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          before={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in files if n}
          (Path(os.environ['RUNNER_TEMP'])/'rl-before.json').write_text(json.dumps(before))
          PY
      - name: Build with the current repository sources
        run: |
          python3 -m venv "$RUNNER_TEMP/rl-build-env"
          "$RUNNER_TEMP/rl-build-env/bin/python" -m pip install -q -r requirements.txt
          "$RUNNER_TEMP/rl-build-env/bin/python" scripts/build.py
      - name: Verify placeholders, search, links and preservation
        run: |
          python3 - <<'PY'
          import json,hashlib,os,re,subprocess
          from pathlib import Path
          from urllib.parse import urlparse
          topics=['ppo','dpo','grpo','gspo','dapo']
          generated={'notes/rl/index.html',*(f'notes/rl/{s}/index.html' for s in topics)}
          before=json.loads((Path(os.environ['RUNNER_TEMP'])/'rl-before.json').read_text())
          for n,expected in before.items():
              if n!='notes/index.html':
                  assert hashlib.sha256(Path(n).read_bytes()).hexdigest()==expected,'Unexpected change: '+n
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert untracked==generated,(untracked,generated)
          data=json.loads(Path('content/notes/rl/index.json').read_text())
          assert [t['slug'] for t in data['topics']]==topics
          assert all(t['status']=='pending' for t in data['topics'])
          for slug in topics:
              assert Path(f'content/notes/rl/{slug}.md').read_text()=='# '+slug.upper()+'\n'
              html=Path(f'notes/rl/{slug}/index.html').read_text()
              assert 'class="rl-empty"' in html and '内容待补充' in html
              assert '<h1 tabindex="-1">'+slug.upper()+'</h1>' in html
          assert Path('notes/rl/index.html').read_text().count('class="rl-topic"')==5
          index=Path('notes/index.html').read_text()
          assert index.count('data-note-card')==2
          assert 'data-note-kind="topic"' in index and 'lora/index.html' in index
          pattern=r'<script type="application/json" id="note-search-data">(.*?)</script>'
          old=subprocess.check_output(['git','show','HEAD:notes/index.html'],text=True)
          old_data=json.loads(re.search(pattern,old,re.S).group(1))
          new_data=json.loads(re.search(pattern,index,re.S).group(1))
          assert new_data[:-1]==old_data and new_data[-1]['slug']=='rl'
          for name in generated:
              p=Path(name); html=p.read_text()
              for link in re.findall(r'(?:href|src)="([^"]+)"',html):
                  url=urlparse(link)
                  if not url.scheme and url.path and not url.path.startswith('/'):
                      assert (p.parent/url.path).resolve().is_file(),(name,link)
          print('PASS: five empty topic pages; prior LoRA search data, articles, experiments and datasets unchanged.')
          PY
      - name: Commit generated pages and remove the temporary builder
        env:
          BRANCH: site/rl-scaffold-20261008
        run: |
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git rm -- .github/workflows/rl-scaffold-preview.yml
          git add -- assets/site.js notes/index.html notes/rl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: generate five pending RL topic pages and retain existing content'
          git push origin "HEAD:$BRANCH"
